<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub profile stats</title>
  <desc id="desc">A stable local stats card showing Harshit Dubey's GitHub profile snapshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0B3B5A"/>
    </linearGradient>
    <linearGradient id="line" x1="100" y1="318" x2="806" y2="182" gradientUnits="userSpaceOnUse">
