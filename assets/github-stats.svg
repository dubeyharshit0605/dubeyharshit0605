      <stop offset="1" stop-color="#63D8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="900" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="784" cy="86" r="112" fill="#63D8FF" opacity="0.12"/>
  <circle cx="104" cy="362" r="126" fill="#D7263D" opacity="0.10"/>
