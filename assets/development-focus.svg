<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Development focus graph</title>
  <desc id="desc">A stable local graph showing development focus across backend, frontend, mobile, GenAI, and DSA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="area" x1="104" y1="104" x2="1110" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="line" x1="104" y1="260" x2="1110" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Development Focus</text>
  <text x="70" y="106" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="18">Stable local graph instead of external analytics images</text>
  <g stroke="#334155" stroke-width="1">
    <path d="M86 144H1124"/>
    <path d="M86 190H1124"/>
    <path d="M86 236H1124"/>
    <path d="M86 282H1124"/>
  </g>
  <path d="M104 260C188 226 238 244 320 204C400 166 470 188 548 152C632 113 710 141 790 126C884 108 958 132 1110 92V282H104V260Z" fill="url(#area)"/>
  <path d="M104 260C188 226 238 244 320 204C400 166 470 188 548 152C632 113 710 141 790 126C884 108 958 132 1110 92" stroke="url(#line)" stroke-width="7" stroke-linecap="round"/>
  <g fill="#38bdf8">
    <circle cx="104" cy="260" r="8"/>
    <circle cx="320" cy="204" r="8"/>
    <circle cx="548" cy="152" r="8"/>
    <circle cx="790" cy="126" r="8"/>
    <circle cx="1110" cy="92" r="8"/>
